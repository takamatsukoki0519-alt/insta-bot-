name: daily-post
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: generate
        run: python bot.py generate
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}", AMAZON_TAG: "${{ secrets.AMAZON_TAG }}" }
      - name: push
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "post" || true
          git push
      - name: post
        run: sleep 30 && python bot.py post
        env: { IG_USER_ID: "${{ secrets.IG_USER_ID }}", IG_ACCESS_TOKEN: "${{ secrets.IG_ACCESS_TOKEN }}" }
